name: Audit CodeQL

on:
  push:
    branches: [ trunk ]
  pull_request:
    branches: [ trunk ]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL C-C++
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0 # tags requis par CMakeLists.txt (git describe)

      - name: Install build dependencies
        run: sudo ./install_deps.sh

      - name: Build and install abls-libs
        run: |
          git clone --depth 1 https://github.com/sebaru/abls-libs /tmp/abls-libs
          cd /tmp/abls-libs
          ./build.sh
          sudo ./install.sh
          pkg-config --modversion abls-libs

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-and-quality

      - name: Build
        run: ./build.sh

      - name: Analyze code
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: /language:c-cpp
